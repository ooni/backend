services:
  fastpath:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ooni-fastpath
    ports:
      - "5000:5000"
      - "8472:8472"
    working_dir: /home/fastpath/app
    command: ["python", "/home/fastpath/app/run_fastpath", "--write-to-disk", "--debug"]
    develop:
      watch:
        - action: sync+restart
          path: ./fastpath
          target: /home/fastpath/app/fastpath
          ignore:
            - __pycache__/
            - "*.pyc"
    depends_on:
      clickhouse-server:
        condition: service_healthy
    profiles:
      - default
      - all


  # This service is used only for testing, in prod we use the actual clickhouse db.
  # The same one-node cluster as the integration tests: `make docker-clickhouse`
  # starts it and loads production's schema from ooni/devops.
  clickhouse-server:
    image: docker.io/clickhouse/clickhouse-server:24.8.6.70
    container_name: clickhouse-server
    hostname: clickhouse-server
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=default
    ports:
      - "9000:9000"
      - "8123:8123"
      - "9009:9009"
    volumes:
       - ./fastpath/tests/integ/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro,z
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password default -q \"SELECT 1 FROM system.zookeeper WHERE path = '/'\""]
      interval: 2s
      retries: 60
      start_period: 5s
      timeout: 5s
    profiles:
      - all
      - clickhouse

volumes:
  clickhouse-data:
