# The fastpath image under test against a one-node ClickHouse cluster with
# production's schema. integ/conftest.py starts ClickHouse, loads the schema,
# then starts fastpath: fastpath's workers read tables when they start.
services:
  clickhouse-server:
    image: docker.io/clickhouse/clickhouse-server:24.8.6.70
    hostname: clickhouse-server
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: default
    volumes:
      - ./integ/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro,z
    ports:
      - "9000"
    ulimits:
      nofile: 262144
    healthcheck:
      # healthy once Keeper answers, so ON CLUSTER DDL works
      test: ["CMD-SHELL", "clickhouse-client --user default --password default -q \"SELECT 1 FROM system.zookeeper WHERE path = '/'\""]
      interval: 2s
      retries: 60
      start_period: 5s
      timeout: 5s

  # As ooni/devops runs it (ansible/roles/fastpath/tasks/main.yml)
  fastpath:
    image: ${FASTPATH_IMAGE:?set FASTPATH_IMAGE to the fastpath image to test}
    command: ["python", "/home/fastpath/app/run_fastpath", "--write-to-disk"]
    environment:
      FASTPATH_QUEUE_PUT_TIMEOUT: "0"
      FASTPATH_NUM_WORKERS: "10"
    volumes:
      - ./integ/fastpath.conf:/etc/ooni/fastpath.conf:ro,z
    ports:
      - "8472"
    stop_grace_period: 120s
    profiles: [fastpath]
