name: test reuploader
on:
  push:
    paths:
      - "reuploader/**"
      - ".github/workflows/test_reuploader.yml"
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: make test
        working-directory: ./reuploader/
