name: test ooniapi/oonirun
on: push
jobs:
  run_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install hatch
        run: pip install "hatch>=1.13" "virtualenv<21"

      - name: Run all tests
        run: make test-cov
        working-directory: ./ooniapi/services/oonirun/

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v5
        with:
          # authenticate with GitHub's OIDC token: no secret needed, and not
          # subject to the rate limit that drops tokenless uploads
          use_oidc: true
          fail_ci_if_error: true
          flags: oonirun
          working-directory: ./ooniapi/services/oonirun/
