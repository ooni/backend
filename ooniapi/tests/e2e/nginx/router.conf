# nginx router for the ooniapi e2e test harness.
#
# This replicates the path-based routing rules that, in production, live in
# the AWS ALB listener rules defined in:
#   ooni/devops: tf/modules/ooniapi_frontend/main.tf
#
# It is intentionally NOT the ooniapi/services/reverseproxy image: that
# container just forwards everything to a single upstream (it assumes
# path-based routing already happened at the ALB), which is of no use here
# since we need to fan requests out to several independent containers.
#
# If devops changes the production routing table, this file needs to be
# updated to match (search this repo's CI for a step that reminds reviewers
# of that when ooniapi_frontend/main.tf changes upstream).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    # Resolve upstream service names dynamically via Docker's embedded DNS
    # (127.0.0.11) instead of nginx's default of resolving proxy_pass
    # hostnames once at startup and caching the IP forever. Without this,
    # nginx refuses to start if a backend container isn't already up (and
    # won't notice if one restarts with a new IP afterwards) - each
    # location below therefore sets a $upstream_<service> variable and
    # passes through that instead of a literal proxy_pass host.
    resolver 127.0.0.11 valid=10s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Router's own health check (not part of the ALB rule set).
    location = /health {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # ooniauth  (ALB priority 108)
    # ---------------------------------------------------------------
    location ^~ /api/v2/ooniauth/       { set $upstream_ooniauth "http://ooniauth:80"; proxy_pass $upstream_ooniauth; }
    location  = /api/v1/user_register   { set $upstream_ooniauth "http://ooniauth:80"; proxy_pass $upstream_ooniauth; }
    location  = /api/v1/user_login      { set $upstream_ooniauth "http://ooniauth:80"; proxy_pass $upstream_ooniauth; }
    location  = /api/v1/user_refresh_token { set $upstream_ooniauth "http://ooniauth:80"; proxy_pass $upstream_ooniauth; }
    location  = /api/_/account_metadata { set $upstream_ooniauth "http://ooniauth:80"; proxy_pass $upstream_ooniauth; }

    # ---------------------------------------------------------------
    # oonirun  (ALB priority 110)
    # ---------------------------------------------------------------
    location ^~ /api/v2/oonirun/        { set $upstream_oonirun "http://oonirun:80"; proxy_pass $upstream_oonirun; }

    # ---------------------------------------------------------------
    # ooniprobe / probe_services (ALB priorities 120-123)
    # This is the tier0 service miniooni actually talks to.
    # ---------------------------------------------------------------
    location ^~ /api/v2/ooniprobe/      { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/v1/login           { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/v1/register        { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/update/         { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/check-in        { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/test-helpers    { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/v1/test-list/urls  { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /report                 { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/_/show_countries_prioritization { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/_/debug_prioritization          { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    # anonymous credentials + measurement submission
    location ^~ /api/v1/manifest           { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/sign_credential    { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/submit_measurement { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /bouncer/net-tests       { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/geolookup        { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location ^~ /api/v1/collectors       { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/v1/test-list/tor-targets    { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }
    location  = /api/v1/test-list/psiphon-config { set $upstream_ooniprobe "http://ooniprobe:80"; proxy_pass $upstream_ooniprobe; }

    # ---------------------------------------------------------------
    # oonifindings  (ALB priority 130)
    # ---------------------------------------------------------------
    location ^~ /api/v1/incidents/      { set $upstream_oonifindings "http://oonifindings:80"; proxy_pass $upstream_oonifindings; }

    # ---------------------------------------------------------------
    # oonimeasurements  (ALB priorities 140-143)
    # ---------------------------------------------------------------
    location ^~ /api/v1/measurements/   { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/raw_measurement { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/measurement_meta { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/measurements    { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/torsf_stats     { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location ^~ /api/v1/aggregation     { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/observations    { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/analysis        { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }
    location  = /api/v1/detector/changepoints { set $upstream_oonimeasurements "http://oonimeasurements:80"; proxy_pass $upstream_oonimeasurements; }

    # ---------------------------------------------------------------
    # testlists  (ALB priority 144)
    # ---------------------------------------------------------------
    location ^~ /api/_/url-submission/test-list/ { set $upstream_testlists "http://testlists:80"; proxy_pass $upstream_testlists; }
    location  = /api/_/url-priorities/list       { set $upstream_testlists "http://testlists:80"; proxy_pass $upstream_testlists; }
    location  = /api/_/url-priorities/update     { set $upstream_testlists "http://testlists:80"; proxy_pass $upstream_testlists; }
    location  = /api/v1/url-submission/submit    { set $upstream_testlists "http://testlists:80"; proxy_pass $upstream_testlists; }
    location  = /api/v1/url-submission/update-url { set $upstream_testlists "http://testlists:80"; proxy_pass $upstream_testlists; }

    # No production default action (that's the legacy monolith proxy target
    # group) - fail loudly instead of silently 200'ing so a routing gap in
    # this file shows up immediately as a test failure.
    location / {
        return 404 "no route configured in ooniapi e2e router for $request_uri\n";
    }
}
